# Performance Configuration for BallistickEMU
# This file allows you to tune performance parameters without recompiling

# Memory Management
memory.high_threshold=0.80
memory.spike_threshold=0.15
memory.gc_threshold=0.85

# Thread Management
thread.high_threshold=150
thread.spike_threshold=0.20

# Database Connection Pool
db.pool.initial_size=15
db.pool.max_size=20
db.connection_timeout_ms=30000
db.validation_timeout_ms=5000

# Performance Monitoring
monitoring.memory_check_interval_ms=60000
monitoring.thread_check_interval_ms=30000
monitoring.db_check_interval_ms=120000
monitoring.lag_spike_threshold_ms=100

# Packet Processing
packet.cache.max_size=1000
packet.cache.clear_interval=1000

# Network Settings
network.idle_time_ms=50
network.read_buffer_size=2048
network.max_players=100

# Logging
logging.performance_file=performance_metrics.txt
logging.memory_file=memory_metrics.txt

